name: inchat

# Local development stack (DEVOPS.md §3): PostgreSQL, Redis, and the api-server
# in one command via `make dev-up`. PostgreSQL and Redis run persistently;
# migrations run on demand via `make migrate`; the api-server is rebuilt and
# run with `make run`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inchat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-server:
    build:
      context: ../../server
      args:
        VERSION: dev
    environment:
      APP_ENV: dev
      APP_HTTP_PORT: "8080"
      APP_PG_DSN: postgres://app:app_password@postgres:5432/inchat?sslmode=disable
      APP_PG_MAX_CONNS: "10"
      APP_REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api-server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Runs only on demand: docker compose --profile tools run --rm migrate (make migrate).
  migrate:
    image: migrate/migrate:v4.17.0
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Distinct migration role (DEVOPS.md §7): never the app role.
      MIGRATION_DSN: postgres://migrator:migrator_password@postgres:5432/inchat?sslmode=disable
    volumes:
      - ../../server/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "${MIGRATION_DSN:-postgres://migrator:migrator_password@postgres:5432/inchat?sslmode=disable}"
      - "up"

volumes:
  pgdata:
  redisdata:
